spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
  application:
    name: secure-auth-service

  data:
    redis:
      connect-timeout: 1s
      timeout: 1s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/authdb}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            time_zone: UTC
    show-sql: false
  jackson:
    # Keep existing public JSON defaults while using Jackson 3.
    use-jackson2-defaults: true
    time-zone: UTC

server:
  port: 8081
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}

app:
  verification:
    outbox-key: ${APP_MAIL_OUTBOX_KEY}
    public-url: ${APP_VERIFICATION_PUBLIC_URL:http://localhost:8081/verify-email.html}
    from: ${APP_MAIL_FROM:no-reply@example.invalid}
    worker-enabled: ${APP_MAIL_WORKER_ENABLED:true}
  security:
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
  token-cleanup:
    enabled: ${APP_TOKEN_CLEANUP_ENABLED:true}
    retention-days: ${APP_TOKEN_CLEANUP_RETENTION_DAYS:30}
    batch-size: ${APP_TOKEN_CLEANUP_BATCH_SIZE:1000}
    max-batches: ${APP_TOKEN_CLEANUP_MAX_BATCHES:10}
    max-runtime-seconds: ${APP_TOKEN_CLEANUP_MAX_RUNTIME_SECONDS:5}
  rate-limit:
    account-key: ${APP_RATE_LIMIT_ACCOUNT_KEY}
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-limit: ${APP_RATE_LIMIT_LOGIN_LIMIT:10}
    register-limit: ${APP_RATE_LIMIT_REGISTER_LIMIT:5}
    account-limit: ${APP_RATE_LIMIT_ACCOUNT_LIMIT:10}
    account-window-seconds: ${APP_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:300}
    refresh-limit: ${APP_RATE_LIMIT_REFRESH_LIMIT:30}
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
  jwt:
    issuer: "secure-auth-service"
    # 32+ chars secret for HS256 (in real world use env/secret manager)
    secret: ${APP_JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
  refresh-token:
    # server-side pepper to hash refresh tokens (keep in env)
    pepper: ${APP_REFRESH_PEPPER}





