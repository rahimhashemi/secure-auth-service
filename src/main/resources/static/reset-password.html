<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset your password</title>
    <script src="reset-password.js" defer></script>
</head>
<body><main>
    <h1>Reset your password</h1>
    <form id="reset" method="post">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" required>
        <label for="confirmation">Confirm new password</label>
        <input id="confirmation" type="password" autocomplete="new-password" required>
        <button id="submit" type="submit" disabled>Reset password</button>
    </form>
    <p id="result" role="status"></p>
</main></body>
</html>
