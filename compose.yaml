services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
      APP_API_DOCS_ENABLED: ${APP_API_DOCS_ENABLED:-true}
      APP_RATE_LIMIT_REGISTER_LIMIT: ${APP_RATE_LIMIT_REGISTER_LIMIT:-5}
      APP_RATE_LIMIT_ACCOUNT_LIMIT: ${APP_RATE_LIMIT_ACCOUNT_LIMIT:-10}
      APP_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS: ${APP_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:-300}
      APP_RATE_LIMIT_ACCOUNT_KEY: ${APP_RATE_LIMIT_ACCOUNT_KEY:?Set APP_RATE_LIMIT_ACCOUNT_KEY}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_LOGIN_LIMIT: ${APP_RATE_LIMIT_LOGIN_LIMIT:-10}
      APP_RATE_LIMIT_REFRESH_LIMIT: ${APP_RATE_LIMIT_REFRESH_LIMIT:-30}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_MAIL_OUTBOX_KEY: ${APP_MAIL_OUTBOX_KEY:?Set APP_MAIL_OUTBOX_KEY}
      APP_VERIFICATION_PUBLIC_URL: ${APP_VERIFICATION_PUBLIC_URL:-http://localhost:8081/verify-email.html}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@example.invalid}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET}
      APP_REFRESH_PEPPER: ${APP_REFRESH_PEPPER:?Set APP_REFRESH_PEPPER}

    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy




